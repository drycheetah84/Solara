    service: http://127.0.0.1:90

  # A2StationDb - stations / roles / quests / deployments  (game: api.oriondrift.net)
  # NOTE: api.halcy0n.net already has an A record -> 157.173.194.216 (not this tunnel).
  # Using station.halcy0n.net instead; repoint api.* to this tunnel if you want that name.
  - hostname: station.halcy0n.net
    service: http://127.0.0.1:78

  # EOS gateway - server list  (game: EOS / *.epicgames.com)
